sonar.projectKey=TFG_CALIDAD_DATOS_IA
sonar.projectName=TFG Calidad de Datos IA
sonar.projectVersion=1.0

sonar.host.url=http://localhost:9003

# Fuentes analizadas
sonar.sources=frontend/src,backend

# Tests
sonar.tests=backend/tests
sonar.test.inclusions=backend/tests/**/*

# Exclusiones (node_modules, migraciones, venv, archivos generados)
sonar.exclusions=\
  frontend/node_modules/**,\
  frontend/.next/**,\
  frontend/pnpm-lock.yaml,\
  frontend/package-lock.json,\
  backend/venv/**,\
  backend/__pycache__/**,\
  backend/migrations/**,\
  backend/.pytest_cache/**,\
  **/celerybeat-schedule,\
  **/*.pyc

# Cobertura de Python (pytest-cov genera este archivo)
sonar.python.coverage.reportPaths=backend/coverage.xml

# Versión de Python
sonar.python.version=3.11

# Encoding
sonar.sourceEncoding=UTF-8
