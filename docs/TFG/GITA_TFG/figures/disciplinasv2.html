<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esfuerzo por Disciplinas — DataQualAI</title>
<style>
  :root {
    --text-main: #334155;
    --text-muted: #64748B;
    --border-color: #CBD5E1;
    --bg-header: #1E293B;
    --bg-sidebar: #F8FAFC;
    --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-family);
    background: #ffffff;
    padding: 40px;
    display: flex;
    justify-content: center;
    color: var(--text-main);
  }

  .chart-container {
    width: 100%;
    max-width: 1050px;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
  }

  .chart-header {
    background: var(--bg-header);
    color: #ffffff;
    padding: 16px 20px;
    font-size: 1.1rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 3px solid #0EA5E9;
  }

  svg {
    display: block;
    width: 100%;
    height: auto;
  }

  /* Estilos SVG interactivos */
  .discipline-row:hover rect.row-bg {
    fill: #F1F5F9;
  }
  .discipline-row path.area {
    transition: transform 0.2s ease, opacity 0.2s ease;
  }
  .discipline-row:hover path.area {
    opacity: 1;
    filter: drop-shadow(0 4px 6px rgba(0,0,0,0.15));
  }
</style>
</head>
<body>

<div class="chart-container">
  <div class="chart-header">
    Distribución de Esfuerzo por Disciplinas — DataQualAI
  </div>
  
  <svg id="chart" viewBox="0 0 1000 480"></svg>
</div>

<script>
  // ── Configuración Geométrica ──
  const SVG_W = 1000;
  const HEADER_H = 50;
  const ROW_H = 75;
  const SIDEBAR_W = 220;
  const CHART_W = SVG_W - SIDEBAR_W; // 780
  
  // ── Datos del Proyecto ──
  const sprints = [
    { label: 'S1', dates: 'Ago–Sep' },
    { label: 'S2', dates: 'Ene' },
    { label: 'S3', dates: 'Feb' },
    { label: 'S4', dates: 'Mar' },
    { label: 'S5', dates: 'Abr' },
    { label: 'S6', dates: 'May–Jun' }
  ];

  // Datos normalizados (0 a 100) para cada punto de control (Inicio, Centro de cada S1-S6, Fin)
  // Total 8 puntos de anclaje
  const disciplines = [
    { name: 'Requisitos y Análisis',  color: '#EF4444', data: [0, 85, 25, 10,  5,  5,  0, 0] },
    { name: 'Diseño y Arquitectura',  color: '#F59E0B', data: [0, 35, 80, 25, 10,  5,  0, 0] },
    { name: 'Implementación (Dev)',   color: '#0EA5E9', data: [0,  5, 45, 90, 85, 50,  5, 0] },
    { name: 'Pruebas y Validación',   color: '#10B981', data: [0,  0, 10, 30, 50, 85, 40, 0] },
    { name: 'Documentación y Cierre', color: '#8B5CF6', data: [0,  0,  5, 10, 20, 35, 90, 0] }
  ];

  const SVG_H = HEADER_H + (disciplines.length * ROW_H); // 50 + (5 * 75) = 425

  const svg = document.getElementById('chart');
  svg.setAttribute('viewBox', `0 0 ${SVG_W} ${SVG_H}`);
  const NS = 'http://www.w3.org/2000/svg';

  function createEl(tag, attrs) {
    const el = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  }

  // Generador de curvas (Cardinal Spline)
  function getSplinePath(xs, ys, tension = 0.35) {
    let d = `M ${xs[0].toFixed(2)} ${ys[0].toFixed(2)}`;
    for (let i = 0; i < xs.length - 1; i++) {
      const p0x = xs[Math.max(0, i-1)], p0y = ys[Math.max(0, i-1)];
      const p1x = xs[i], p1y = ys[i];
      const p2x = xs[i+1], p2y = ys[i+1];
      const p3x = xs[Math.min(xs.length-1, i+2)], p3y = ys[Math.min(ys.length-1, i+2)];
      
      const cp1x = p1x + (p2x - p0x) * tension;
      const cp1y = p1y + (p2y - p0y) * tension;
      const cp2x = p2x - (p3x - p1x) * tension;
      const cp2y = p2y - (p3y - p1y) * tension;
      
      d += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2x.toFixed(2)} ${p2y.toFixed(2)}`;
    }
    return d;
  }

  // ── Filtros y Gradientes ──
  const defs = createEl('defs', {});
  
  // Sombra para las curvas
  const filter = createEl('filter', { id: 'shadow', x: '-10%', y: '-20%', width: '120%', height: '140%' });
  filter.innerHTML = `<feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.2"/>`;
  defs.appendChild(filter);

  // Gradientes por disciplina
  disciplines.forEach((d, i) => {
    const grad = createEl('linearGradient', { id: `grad-${i}`, x1: '0', y1: '0', x2: '0', y2: '1' });
    grad.innerHTML = `
      <stop offset="0%" stop-color="${d.color}" stop-opacity="0.85" />
      <stop offset="100%" stop-color="${d.color}" stop-opacity="0.2" />
    `;
    defs.appendChild(grad);
  });
  svg.appendChild(defs);

  // ── Fondo y Estructura ──
  // Sidebar Fondo
  svg.appendChild(createEl('rect', { x: 0, y: HEADER_H, width: SIDEBAR_W, height: SVG_H - HEADER_H, fill: 'var(--bg-sidebar)' }));
  // Línea separadora Sidebar
  svg.appendChild(createEl('line', { x1: SIDEBAR_W, y1: 0, x2: SIDEBAR_W, y2: SVG_H, stroke: '#CBD5E1', 'stroke-width': 1 }));

  // Cabecera Columnas (Sprints)
  const colW = CHART_W / sprints.length; // 780 / 6 = 130
  sprints.forEach((s, i) => {
    const x = SIDEBAR_W + (i * colW);
    
    // Separador vertical discontinuo
    if (i > 0) {
      svg.appendChild(createEl('line', {
        x1: x, y1: HEADER_H, x2: x, y2: SVG_H,
        stroke: '#94A3B8', 'stroke-dasharray': '5 5', 'stroke-width': 1
      }));
    }

    // Texto Cabecera (Fondo gris clarito)
    svg.appendChild(createEl('rect', { x: x, y: 0, width: colW, height: HEADER_H, fill: '#F1F5F9', stroke: '#E2E8F0' }));
    
    const label = createEl('text', { x: x + colW/2, y: 20, 'text-anchor': 'middle', fill: '#334155', 'font-size': '13', 'font-weight': '600' });
    label.textContent = s.label;
    
    const dates = createEl('text', { x: x + colW/2, y: 38, 'text-anchor': 'middle', fill: '#64748B', 'font-size': '11' });
    dates.textContent = s.dates;

    svg.appendChild(label);
    svg.appendChild(dates);
  });

  // Cabecera Sidebar (Esquina superior izquierda)
  svg.appendChild(createEl('rect', { x: 0, y: 0, width: SIDEBAR_W, height: HEADER_H, fill: '#E2E8F0', stroke: '#CBD5E1' }));
  const sidebarHeader = createEl('text', { x: 20, y: 30, fill: '#334155', 'font-size': '13', 'font-weight': '700', 'letter-spacing': '0.05em' });
  sidebarHeader.textContent = 'DISCIPLINAS';
  svg.appendChild(sidebarHeader);

  // ── Coordenadas X para los datos ──
  // 0 (inicio), centro de S1, centro de S2... centro de S6, fin
  const dataXs = [
    SIDEBAR_W,
    SIDEBAR_W + (colW * 0.5),
    SIDEBAR_W + (colW * 1.5),
    SIDEBAR_W + (colW * 2.5),
    SIDEBAR_W + (colW * 3.5),
    SIDEBAR_W + (colW * 4.5),
    SIDEBAR_W + (colW * 5.5),
    SVG_W
  ];

  // ── Filas y Curvas de Datos ──
  disciplines.forEach((d, i) => {
    const rowY = HEADER_H + (i * ROW_H);
    const baseline = rowY + ROW_H;
    const maxHumpHeight = ROW_H - 15; // Dejamos 15px de margen superior en cada carril

    const group = createEl('g', { class: 'discipline-row' });

    // Fondo interactivo de la fila
    group.appendChild(createEl('rect', {
      x: 0, y: rowY, width: SVG_W, height: ROW_H,
      fill: 'transparent', class: 'row-bg'
    }));

    // Línea base de la fila
    group.appendChild(createEl('line', {
      x1: 0, y1: baseline, x2: SVG_W, y2: baseline,
      stroke: '#E2E8F0', 'stroke-width': 1
    }));

    // Etiqueta de la disciplina en el Sidebar
    const icon = createEl('rect', { x: 20, y: rowY + (ROW_H/2) - 4, width: 8, height: 8, fill: d.color, rx: 2 });
    const text = createEl('text', {
      x: 38, y: rowY + (ROW_H/2) + 4,
      fill: '#334155', 'font-size': '12.5', 'font-weight': '500'
    });
    text.textContent = d.name;
    
    group.appendChild(icon);
    group.appendChild(text);

    // Calcular coordenadas Y de la curva
    const dataYs = d.data.map(val => baseline - ((val / 100) * maxHumpHeight));

    // Generar path
    const pathString = getSplinePath(dataXs, dataYs);
    const closedPath = `${pathString} L ${SVG_W} ${baseline} L ${SIDEBAR_W} ${baseline} Z`;

    // Área rellena con gradiente
    group.appendChild(createEl('path', {
      d: closedPath,
      fill: `url(#grad-${i})`,
      class: 'area',
      filter: 'url(#shadow)'
    }));

    // Línea superior (stroke)
    group.appendChild(createEl('path', {
      d: pathString,
      fill: 'none',
      stroke: d.color,
      'stroke-width': 2.5,
      'stroke-linecap': 'round'
    }));

    svg.appendChild(group);
  });

</script>
</body>
</html>
