<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esfuerzo por Disciplinas — DataQualAI</title>
<style>
  :root {
    --text-main: #334155;
    --text-muted: #64748B;
    --bg-light: #F8FAFC;
    --border-color: #E2E8F0;
    --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-family);
    background: #ffffff;
    padding: 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    color: var(--text-main);
  }

  .chart-container {
    width: 100%;
    max-width: 1000px;
    background: #ffffff;
    border: 1px solid var(--border-color);
    border-radius: 12px;
    padding: 32px;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
    position: relative;
  }

  h2 {
    font-size: 1.25rem;
    font-weight: 700;
    color: #0F172A;
    text-align: left;
    margin-bottom: 24px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    border-bottom: 2px solid var(--border-color);
    padding-bottom: 12px;
  }

  svg {
    width: 100%;
    height: auto;
    display: block;
    overflow: visible;
  }

  /* Animaciones SVG */
  .discipline-group {
    transition: opacity 0.3s ease;
  }
  
  .data-point {
    transition: r 0.2s ease, stroke-width 0.2s ease;
    cursor: pointer;
  }
  .data-point:hover {
    r: 7;
    stroke-width: 3;
  }

  .legend-item {
    cursor: pointer;
    transition: transform 0.2s ease;
  }
  .legend-item:hover {
    transform: translateY(-2px);
  }

  /* Tooltip HTML */
  #tooltip {
    position: absolute;
    opacity: 0;
    background: #0F172A;
    color: #ffffff;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 0.8rem;
    font-weight: 600;
    pointer-events: none;
    transform: translate(-50%, -120%);
    transition: opacity 0.2s ease, left 0.1s ease, top 0.1s ease;
    box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    z-index: 100;
    white-space: nowrap;
  }
  #tooltip::after {
    content: '';
    position: absolute;
    top: 100%;
    left: 50%;
    margin-left: -5px;
    border-width: 5px;
    border-style: solid;
    border-color: #0F172A transparent transparent transparent;
  }

</style>
</head>
<body>

<div class="chart-container">
  <h2>Distribución de Esfuerzo (Metodología Ágil) — DataQualAI</h2>
  
  <svg id="chart" viewBox="0 0 940 400"></svg>

  <div id="tooltip"></div>
</div>

<script>
  // ── Configuración Geométrica ──
  const SVG_W = 940, SVG_H = 400;
  const MARGIN = { top: 20, right: 20, bottom: 80, left: 50 };
  const W = SVG_W - MARGIN.left - MARGIN.right;
  const H = SVG_H - MARGIN.top - MARGIN.bottom;

  // ── Datos del Proyecto ──
  const sprints = [
    { id: 'S1', name: 'Sprint 1', dates: 'Oct–Nov 25' },
    { id: 'S2', name: 'Sprint 2', dates: 'Dic–Ene 26' },
    { id: 'S3', name: 'Sprint 3', dates: 'Feb 2026' },
    { id: 'S4', name: 'Sprint 4', dates: 'Mar 2026' },
    { id: 'S5', name: 'Sprint 5', dates: 'Abr 2026' },
    { id: 'S6', name: 'Sprint 6', dates: 'May–Jun 26' },
  ];

  // Colores corporativos consistentes con la versión final del Gantt
  const disciplines = [
    { name: 'Requisitos y Análisis', color: '#EF4444', data: [85, 30, 15, 10,  5,  5] },  // Rojo
    { name: 'Diseño y Arquitectura', color: '#F59E0B', data: [60, 65, 25, 15, 10,  5] },  // Ámbar
    { name: 'Implementación (Dev)',  color: '#0EA5E9', data: [15, 50, 85, 80, 65, 10] },  // Azul
    { name: 'Pruebas (Testing)',     color: '#10B981', data: [ 5, 15, 30, 45, 60, 35] },  // Verde
    { name: 'Documentación y Cierre',color: '#8B5CF6', data: [10, 10, 15, 20, 30, 85] },  // Violeta
  ];

  const n = sprints.length;
  const segmentWidth = W / (n - 1); // Distribuimos de borde a borde

  // Coordenadas X para los Sprints
  const sprintXs = sprints.map((_, i) => MARGIN.left + i * segmentWidth);
  const baseline = MARGIN.top + H;
  const yScale = val => MARGIN.top + H - (val / 100) * H;

  // ── Inicialización SVG ──
  const svg = document.getElementById('chart');
  const NS = 'http://www.w3.org/2000/svg';

  function createEl(tag, attrs) {
    const el = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  }

  // Generador de curvas (Cardinal Spline)
  function getSplinePath(xs, ys, tension = 0.35) {
    let d = `M ${xs[0].toFixed(2)} ${ys[0].toFixed(2)}`;
    for (let i = 0; i < xs.length - 1; i++) {
      const p0x = xs[Math.max(0, i-1)], p0y = ys[Math.max(0, i-1)];
      const p1x = xs[i], p1y = ys[i];
      const p2x = xs[i+1], p2y = ys[i+1];
      const p3x = xs[Math.min(xs.length-1, i+2)], p3y = ys[Math.min(ys.length-1, i+2)];
      
      const cp1x = p1x + (p2x - p0x) * tension;
      const cp1y = p1y + (p2y - p0y) * tension;
      const cp2x = p2x - (p3x - p1x) * tension;
      const cp2y = p2y - (p3y - p1y) * tension;
      
      d += ` C ${cp1x.toFixed(2)} ${cp1y.toFixed(2)}, ${cp2x.toFixed(2)} ${cp2y.toFixed(2)}, ${p2x.toFixed(2)} ${p2y.toFixed(2)}`;
    }
    return d;
  }

  // ── 1. Fondo y Cuadrícula ──
  // Grid Y
  [25, 50, 75, 100].forEach(pct => {
    const y = yScale(pct);
    svg.appendChild(createEl('line', {
      x1: MARGIN.left, y1: y, x2: MARGIN.left + W, y2: y,
      stroke: '#E2E8F0', 'stroke-dasharray': '4 4'
    }));
    
    const text = createEl('text', {
      x: MARGIN.left - 10, y: y + 4,
      'text-anchor': 'end', fill: '#64748B', 'font-size': '11'
    });
    text.textContent = pct + '%';
    svg.appendChild(text);
  });

  // Ejes Base
  svg.appendChild(createEl('line', {
    x1: MARGIN.left, y1: MARGIN.top, x2: MARGIN.left, y2: baseline,
    stroke: '#94A3B8', 'stroke-width': 2
  }));
  svg.appendChild(createEl('line', {
    x1: MARGIN.left, y1: baseline, x2: MARGIN.left + W, y2: baseline,
    stroke: '#94A3B8', 'stroke-width': 2
  }));

  // Líneas Verticales y Etiquetas X
  sprints.forEach((s, i) => {
    const x = sprintXs[i];
    // Línea guía
    svg.appendChild(createEl('line', {
      x1: x, y1: MARGIN.top, x2: x, y2: baseline,
      stroke: '#F1F5F9', 'stroke-width': i===0 || i===n-1 ? 0 : 2
    }));
    
    // Etiqueta Sprint
    const lbl1 = createEl('text', {
      x: x, y: baseline + 24,
      'text-anchor': 'middle', fill: '#1E293B',
      'font-size': '13', 'font-weight': '600'
    });
    lbl1.textContent = s.name;
    
    // Etiqueta Fecha
    const lbl2 = createEl('text', {
      x: x, y: baseline + 40,
      'text-anchor': 'middle', fill: '#64748B',
      'font-size': '11'
    });
    lbl2.textContent = s.dates;
    
    svg.appendChild(lbl1);
    svg.appendChild(lbl2);
  });

  // Etiqueta Eje Y
  const yAxisLabel = createEl('text', {
    x: 12, y: MARGIN.top + H / 2,
    transform: `rotate(-90, 12, ${MARGIN.top + H / 2})`,
    'text-anchor': 'middle', fill: '#334155',
    'font-size': '12', 'font-weight': '600', 'letter-spacing': '0.05em'
  });
  yAxisLabel.textContent = 'INTENSIDAD DE ESFUERZO';
  svg.appendChild(yAxisLabel);

  // ── 2. Dibujado de Disciplinas (Curvas) ──
  const tooltip = document.getElementById('tooltip');

  disciplines.forEach((d, dIdx) => {
    const group = createEl('g', { class: 'discipline-group', id: `group-${dIdx}` });
    const ys = d.data.map(v => yScale(v));
    const pathData = getSplinePath(sprintXs, ys);
    
    // Área con gradiente simulado por opacidad
    const areaPath = `${pathData} L ${sprintXs[n-1]} ${baseline} L ${sprintXs[0]} ${baseline} Z`;
    group.appendChild(createEl('path', {
      d: areaPath, fill: d.color, 'fill-opacity': '0.1'
    }));

    // Línea principal
    group.appendChild(createEl('path', {
      d: pathData, fill: 'none', stroke: d.color,
      'stroke-width': '3', 'stroke-linecap': 'round'
    }));

    // Puntos interactivos
    sprintXs.forEach((x, i) => {
      const circle = createEl('circle', {
        cx: x, cy: ys[i], r: 5,
        fill: '#ffffff', stroke: d.color,
        'stroke-width': '2', class: 'data-point'
      });

      // Interactividad: Tooltips
      circle.addEventListener('mouseenter', (e) => {
        const rect = e.target.getBoundingClientRect();
        tooltip.style.opacity = '1';
        tooltip.innerHTML = `${d.name}: <span style="color:${d.color}">${d.data[i]}%</span>`;
        // Posicionamiento centrado sobre el punto
        tooltip.style.left = `${rect.left + rect.width / 2 + window.scrollX}px`;
        tooltip.style.top = `${rect.top + window.scrollY - 10}px`;
      });
      circle.addEventListener('mouseleave', () => {
        tooltip.style.opacity = '0';
      });

      group.appendChild(circle);
    });

    svg.appendChild(group);
  });

  // ── 3. Leyenda Interactiva ──
  const legendGroup = createEl('g', { transform: `translate(${MARGIN.left}, ${SVG_H - 15})` });
  const totalLegendW = 860; 
  const itemW = totalLegendW / disciplines.length;

  disciplines.forEach((d, i) => {
    const itemG = createEl('g', { class: 'legend-item', transform: `translate(${i * itemW}, 0)` });
    
    itemG.appendChild(createEl('rect', {
      x: 0, y: -10, width: 14, height: 14, rx: 3, fill: d.color
    }));
    
    const text = createEl('text', {
      x: 22, y: 2, fill: '#334155', 'font-size': '12', 'font-weight': '500'
    });
    text.textContent = d.name;
    itemG.appendChild(text);

    // Interactividad: Resaltar disciplina al pasar por la leyenda
    itemG.addEventListener('mouseenter', () => {
      document.querySelectorAll('.discipline-group').forEach((g, gIdx) => {
        if (gIdx !== i) g.style.opacity = '0.1'; // Atenuar el resto
      });
    });
    itemG.addEventListener('mouseleave', () => {
      document.querySelectorAll('.discipline-group').forEach(g => {
        g.style.opacity = '1'; // Restaurar todos
      });
    });

    legendGroup.appendChild(itemG);
  });
  
  svg.appendChild(legendGroup);

</script>
</body>
</html>
